<!DOCTYPE html>
<html>
<head>
    <title>Video Toaster - Push/Pull</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script>
        const vertexShader = `
            attribute vec2 aPosition;
            attribute vec2 aTexCoord;
            varying vec2 vTexCoord;
            void main() {
                vTexCoord = aTexCoord;
                gl_Position = vec4(aPosition, 0, 1);
            }
        `;

        const fragmentShader = `
            precision mediump float;
            varying vec2 vTexCoord;
            uniform float uTime;
            uniform vec2 uResolution;
            
            void main() {
                // Push/Pull: source enters from sides
                float t = mod(uTime, 2.0);
                float progress = smoothstep(0.0, 1.0, t);
                
                // Left side shows source 1, right side shows source 2
                float pushAmount = progress * uResolution.x;
                
                vec2 color;
                if (vTexCoord.x < progress) {
                    color = vec2(1.0, 0.3, 0.3); // Source 1 (red-ish)
                } else {
                    color = vec2(0.3, 0.3, 1.0); // Source 2 (blue-ish)
                }
                
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        let shader;
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            shader = createShader(vertexShader, fragmentShader);
        }

        function draw() {
            background(0);
            shader.setUniform('uTime', frameCount * 0.016);
            shader.setUniform('uResolution', [width, height]);
            shader.drawRect(0, 0, width, height);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
