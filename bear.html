<!DOCTYPE html>
<html>
<head>
    <title>Video Toaster - BEAR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script>
        const vertexShader = `
            attribute vec2 aPosition;
            attribute vec2 aTexCoord;
            varying vec2 vTexCoord;
            void main() {
                vTexCoord = aTexCoord;
                gl_Position = vec4(aPosition, 0, 1);
            }
        `;

        const fragmentShader = `
            precision mediump float;
            varying vec2 vTexCoord;
            uniform float uTime;
            uniform vec2 uResolution;
            
            void main() {
                // BEAR: 4-color wipe moving across screen with matte outline
                vec2 uv = vTexCoord;
                
                // Wipe moves across screen
                float t = mod(uTime, 2.0);
                float wipePos = t;
                
                // Bear shape outline (simplified as a moving shape)
                float shapeX = uv.x - wipePos;
                float shapeY = uv.y - 0.5;
                float dist = length(vec2(shapeX, shapeY));
                
                // Create bear-like outline with matte
                float outline = smoothstep(0.15, 0.1, dist);
                float matteWidth = 0.05;
                float matte = smoothstep(matteWidth, 0.0, abs(dist - 0.1));
                
                vec3 color;
                if (dist < 0.1 - matteWidth) {
                    // Inside shape - source 2
                    color = vec3(0.2, 0.6, 0.2);
                } else if (dist < 0.1) {
                    // Matte outline
                    color = vec3(0.8, 0.8, 0.8);
                } else {
                    // Outside - source 1
                    color = vec3(0.8, 0.3, 0.3);
                }
                
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        let shader;
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            shader = createShader(vertexShader, fragmentShader);
        }

        function draw() {
            background(0);
            shader.setUniform('uTime', frameCount * 0.016);
            shader.setUniform('uResolution', [width, height]);
            shader.drawRect(0, 0, width, height);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
