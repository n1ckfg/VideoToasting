<!DOCTYPE html>
<html>
<head>
    <title>Video Toaster - NEON BANDS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script>
        const vertexShader = `
            attribute vec3 aPosition;
            attribute vec2 aTexCoord;
            uniform mat4 uModelViewMatrix;
            uniform mat4 uProjectionMatrix;
            varying vec2 vTexCoord;
            void main() {
                vTexCoord = aTexCoord;
                gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(aPosition, 1.0);
            }
        `;

        const fragmentShader = `
            precision mediump float;
            varying vec2 vTexCoord;
            uniform float uTime;
            uniform vec2 uResolution;
            uniform sampler2D texRed;
            uniform sampler2D texBlue;
            uniform sampler2D texOrange;
            uniform sampler2D texGreen;
            uniform sampler2D texYellow;
            uniform sampler2D texGray;


            #define NUM_BANDS 8

            void main() {
                // NEON BANDS: Color cycling palette fade transition
                vec2 uv = vTexCoord;

                // Create horizontal neon bands
                float bandHeight = 1.0 / float(NUM_BANDS);

                vec3 color = vec3(0.0);
                for (int i = 0; i < NUM_BANDS; i++) {
                    float bandY = float(i) * bandHeight;
                    float bandCenter = bandY + bandHeight * 0.5;

                    // Cycle through colors based on time
                    float bandOpacity = smoothstep(bandHeight * 0.4, 0.0, abs(uv.y - bandCenter));

                    // Neon colors cycling
                    vec3 neonColor = vec3(
                        0.5 + 0.5 * sin(uTime * 2.0 + float(i) * 0.5),
                        0.5 + 0.5 * sin(uTime * 2.0 + float(i) * 0.5 + 2.0),
                        0.5 + 0.5 * sin(uTime * 2.0 + float(i) * 0.5 + 4.0)
                    );

                    color += bandOpacity * neonColor;
                }

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        let shaderProgram;
        let vidRed, vidBlue, vidOrange, vidGreen, vidYellow, vidGray;

        function setup() {
            createCanvas(windowWidth, windowHeight, WEBGL);
            noStroke();
            shaderProgram = createShader(vertexShader, fragmentShader);

            vidRed = createVideo(['../images/bedtime.mp4']);
            vidRed.hide(); vidRed.loop(); vidRed.volume(0);
            vidBlue = createVideo(['../images/best_friend.mp4']);
            vidBlue.hide(); vidBlue.loop(); vidBlue.volume(0);
            vidOrange = createVideo(['../images/nope_camel.mp4']);
            vidOrange.hide(); vidOrange.loop(); vidOrange.volume(0);
            vidGreen = createVideo(['../images/oblueterate.mp4']);
            vidGreen.hide(); vidGreen.loop(); vidGreen.volume(0);
            vidYellow = createVideo(['../images/sinistar.mp4']);
            vidYellow.hide(); vidYellow.loop(); vidYellow.volume(0);
            vidGray = createVideo(['../images/snow_shiba.mp4']);
            vidGray.hide(); vidGray.loop(); vidGray.volume(0);

        }

        function draw() {
            shader(shaderProgram);
            shaderProgram.setUniform('uTime', frameCount * 0.016);
            shaderProgram.setUniform('uResolution', [width, height]);

            shaderProgram.setUniform('texRed', vidRed);
            shaderProgram.setUniform('texBlue', vidBlue);
            shaderProgram.setUniform('texOrange', vidOrange);
            shaderProgram.setUniform('texGreen', vidGreen);
            shaderProgram.setUniform('texYellow', vidYellow);
            shaderProgram.setUniform('texGray', vidGray);

            plane(width, height);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight, WEBGL);
        }
    </script>
</body>
</html>
