<!DOCTYPE html>
<html>
<head>
    <title>Video Toaster - BEAR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script>
        const vertexShader = `
            attribute vec3 aPosition;
            attribute vec2 aTexCoord;
            uniform mat4 uModelViewMatrix;
            uniform mat4 uProjectionMatrix;
            varying vec2 vTexCoord;
            void main() {
                vTexCoord = aTexCoord;
                gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(aPosition, 1.0);
            }
        `;

        const fragmentShader = `
            precision mediump float;
            varying vec2 vTexCoord;
            uniform float uTime;
            uniform vec2 uResolution;

            void main() {
                // BEAR: 4-color wipe moving across screen with matte outline
                vec2 uv = vTexCoord;

                // Wipe moves across screen
                float t = mod(uTime, 2.0);
                float wipePos = t;

                // Bear shape outline (simplified as a moving shape)
                float shapeX = uv.x - wipePos;
                float shapeY = uv.y - 0.5;
                float dist = length(vec2(shapeX, shapeY));

                // Create bear-like outline with matte
                float matteWidth = 0.05;

                vec3 color;
                if (dist < 0.1 - matteWidth) {
                    // Inside shape - source 2
                    color = vec3(0.2, 0.6, 0.2);
                } else if (dist < 0.1) {
                    // Matte outline
                    color = vec3(0.8, 0.8, 0.8);
                } else {
                    // Outside - source 1
                    color = vec3(0.8, 0.3, 0.3);
                }

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        let shaderProgram;

        function setup() {
            createCanvas(windowWidth, windowHeight, WEBGL);
            noStroke();
            shaderProgram = createShader(vertexShader, fragmentShader);
        }

        function draw() {
            shader(shaderProgram);
            shaderProgram.setUniform('uTime', frameCount * 0.016);
            shaderProgram.setUniform('uResolution', [width, height]);
            plane(width, height);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight, WEBGL);
        }
    </script>
</body>
</html>
