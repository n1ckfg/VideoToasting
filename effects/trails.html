<!DOCTYPE html>
<html>
<head>
    <title>Video Toaster - Trails</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script>
        const vertexShader = `
            attribute vec3 aPosition;
            attribute vec2 aTexCoord;
            uniform mat4 uModelViewMatrix;
            uniform mat4 uProjectionMatrix;
            varying vec2 vTexCoord;
            void main() {
                vTexCoord = aTexCoord;
                gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(aPosition, 1.0);
            }
        `;

        const fragmentShader = `
            precision mediump float;
            varying vec2 vTexCoord;
            uniform float uTime;
            uniform vec2 uResolution;

            void main() {
                // Trails: moving video leaves trails behind
                vec2 uv = vTexCoord;

                // Create a moving object
                vec2 pos = vec2(0.5 + sin(uTime * 1.5) * 0.3, 0.5 + cos(uTime) * 0.3);
                float dist = length(uv - pos);

                // Object with trailing effect
                float obj = smoothstep(0.1, 0.0, dist);

                // Trail fades over time
                float trail = smoothstep(0.3, 0.1, dist) * max(0.0, 1.0 - dist * 2.0);
                trail *= 0.3;

                vec3 color = obj * vec3(1.0, 1.0, 0.0) + trail * vec3(0.5, 0.5, 0.0);

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        let shaderProgram;

        function setup() {
            createCanvas(windowWidth, windowHeight, WEBGL);
            noStroke();
            shaderProgram = createShader(vertexShader, fragmentShader);
        }

        function draw() {
            shader(shaderProgram);
            shaderProgram.setUniform('uTime', frameCount * 0.016);
            shaderProgram.setUniform('uResolution', [width, height]);
            plane(width, height);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight, WEBGL);
        }
    </script>
</body>
</html>
