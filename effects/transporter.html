<!DOCTYPE html>
<html>
<head>
    <title>Video Toaster - Transporter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script>
        const vertexShader = `
            attribute vec3 aPosition;
            attribute vec2 aTexCoord;
            uniform mat4 uModelViewMatrix;
            uniform mat4 uProjectionMatrix;
            varying vec2 vTexCoord;
            void main() {
                vTexCoord = aTexCoord;
                gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(aPosition, 1.0);
            }
        `;

        const fragmentShader = `
            precision mediump float;
            varying vec2 vTexCoord;
            uniform float uTime;
            uniform vec2 uResolution;

            void main() {
                // Transporter: moving objects in transporter beam
                vec2 uv = vTexCoord;

                // Moving object
                vec2 objPos = vec2(0.3 + sin(uTime) * 0.2, 0.5);
                float objDist = length(uv - objPos);
                float obj = smoothstep(0.15, 0.0, objDist);

                // Transporter beam effect - scan lines
                float scanLine = sin(uv.y * 100.0 - uTime * 20.0);
                float beam = smoothstep(0.5, 1.0, scanLine);

                // Combine object with transporter effect
                float transporter = obj * beam;

                vec3 color = transporter * vec3(0.0, 1.0, 0.8) + obj * 0.3 * vec3(1.0, 0.5, 0.0);

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        let shaderProgram;

        function setup() {
            createCanvas(windowWidth, windowHeight, WEBGL);
            noStroke();
            shaderProgram = createShader(vertexShader, fragmentShader);
        }

        function draw() {
            shader(shaderProgram);
            shaderProgram.setUniform('uTime', frameCount * 0.016);
            shaderProgram.setUniform('uResolution', [width, height]);
            plane(width, height);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight, WEBGL);
        }
    </script>
</body>
</html>
