<!DOCTYPE html>
<html>
<head>
    <title>Video Toaster - Swap</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script>
        const vertexShader = `
            attribute vec3 aPosition;
            attribute vec2 aTexCoord;
            varying vec2 vTexCoord;
            void main() {
                vec4 positionVec4 = vec4(aPosition, 1.0);
                positionVec4.xy = positionVec4.xy * 2.0 - 1.0;
                vTexCoord = aTexCoord;
                gl_Position = positionVec4;
            }
        `;

        const fragmentShader = `
            precision mediump float;
            varying vec2 vTexCoord;
            uniform float uTime;
            uniform vec2 uResolution;

            void main() {
                // Swap: video pieces cross each other
                vec2 uv = vTexCoord;

                // Create 4 quadrants that swap positions
                float leftRight = step(0.5, uv.x);
                float topBot = step(0.5, uv.y);

                vec3 color;
                if (leftRight < 0.5 && topBot < 0.5) {
                    // Bottom-left quadrant
                    color = vec3(1.0, 0.3, 0.3);
                } else if (leftRight > 0.5 && topBot < 0.5) {
                    // Bottom-right quadrant
                    color = vec3(0.3, 1.0, 0.3);
                } else if (leftRight < 0.5 && topBot > 0.5) {
                    // Top-left quadrant
                    color = vec3(0.3, 0.3, 1.0);
                } else {
                    // Top-right quadrant
                    color = vec3(1.0, 1.0, 0.3);
                }

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        let shaderProgram;

        function setup() {
            createCanvas(windowWidth, windowHeight, WEBGL);
            noStroke();
            shaderProgram = createShader(vertexShader, fragmentShader);
        }

        function draw() {
            shader(shaderProgram);
            shaderProgram.setUniform('uTime', frameCount * 0.016);
            shaderProgram.setUniform('uResolution', [width, height]);
            plane(width, height);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight, WEBGL);
        }
    </script>
</body>
</html>
