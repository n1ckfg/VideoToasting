<!DOCTYPE html>
<html>
<head>
    <title>Video Toaster - Blinds 3 Expand</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script>
        const vertexShader = `
            attribute vec2 aPosition;
            attribute vec2 aTexCoord;
            varying vec2 vTexCoord;
            void main() {
                vTexCoord = aTexCoord;
                gl_Position = vec4(aPosition, 0, 1);
            }
        `;

        const fragmentShader = `
            precision mediump float;
            varying vec2 vTexCoord;
            uniform float uTime;
            uniform vec2 uResolution;
            
            void main() {
                // Blinds 3 Expand: Algorithmic 3 vertical rectangles expanding
                vec2 uv = vTexCoord;
                
                // Animation progress
                float t = mod(uTime, 2.0);
                float progress = smoothstep(0.0, 1.0, t);
                
                // Three vertical blinds
                int numBlinds = 3;
                float blindWidth = 1.0 / float(numBlinds);
                
                vec3 color;
                for (int i = 0; i < numBlinds; i++) {
                    float blindCenterX = (float(i) + 0.5) * blindWidth;
                    float blindStart = float(i) * blindWidth;
                    float blindEnd = float(i + 1) * blindWidth;
                    
                    // Expand from center of each blind
                    float distFromCenter = abs(uv.x - blindCenterX);
                    float halfWidth = blindWidth * 0.5 * progress;
                    
                    if (distFromCenter < halfWidth) {
                        // Inside expanding blind
                        float edgeFade = smoothstep(halfWidth, halfWidth * 0.7, distFromCenter);
                        
                        // Alternating colors for each blind
                        if (mod(float(i), 2.0) == 0.0) {
                            color += vec3(1.0, 0.5, 0.0) * edgeFade;
                        } else {
                            color += vec3(0.0, 0.5, 1.0) * edgeFade;
                        }
                    }
                }
                
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        let shader;
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            shader = createShader(vertexShader, fragmentShader);
        }

        function draw() {
            background(0);
            shader.setUniform('uTime', frameCount * 0.016);
            shader.setUniform('uResolution', [width, height]);
            shader.drawRect(0, 0, width, height);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
