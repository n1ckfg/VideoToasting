<!DOCTYPE html>
<html>
<head>
    <title>Video Toaster - Blinds</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script>
        const vertexShader = `
            attribute vec3 aPosition;
            attribute vec2 aTexCoord;
            uniform mat4 uModelViewMatrix;
            uniform mat4 uProjectionMatrix;
            varying vec2 vTexCoord;
            void main() {
                vTexCoord = aTexCoord;
                gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(aPosition, 1.0);
            }
        `;

        const fragmentShader = `
            precision mediump float;
            varying vec2 vTexCoord;
            uniform float uTime;
            uniform vec2 uResolution;

            #define NUM_BLINDS 6

            void main() {
                // Blinds effect: vertical slats compressing/expanding
                float t = mod(uTime, 2.0); // 0 to 2

                vec2 uv = vTexCoord;
                vec3 color = vec3(0.0);

                for (int i = 0; i < NUM_BLINDS; i++) {
                    float pos = float(i) / float(NUM_BLINDS);
                    float nextPos = float(i + 1) / float(NUM_BLINDS);
                    float w = nextPos - pos;

                    // Calculate blind motion - compress to center then expand
                    float compressedWidth = w * (1.0 - t * 0.45);
                    float centerOffset = (pos + nextPos) / 2.0 - 0.5;
                    float blindStart = pos + centerOffset * t;

                    if (uv.x >= blindStart && uv.x < blindStart + compressedWidth) {
                        // Inside this blind - show alternating colors
                        float m = mod(float(i), 2.0);
                        color = m < 0.5 ? vec3(1.0, 0.3, 0.3) : vec3(0.3, 0.3, 1.0);
                    }
                }

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        let shaderProgram;

        function setup() {
            createCanvas(windowWidth, windowHeight, WEBGL);
            noStroke();
            shaderProgram = createShader(vertexShader, fragmentShader);
        }

        function draw() {
            shader(shaderProgram);
            shaderProgram.setUniform('uTime', frameCount * 0.016);
            shaderProgram.setUniform('uResolution', [width, height]);
            plane(width, height);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight, WEBGL);
        }
    </script>
</body>
</html>
