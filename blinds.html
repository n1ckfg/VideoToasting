<!DOCTYPE html>
<html>
<head>
    <title>Video Toaster - Blinds</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script>
        const vertexShader = `
            attribute vec2 aPosition;
            attribute vec2 aTexCoord;
            varying vec2 vTexCoord;
            void main() {
                vTexCoord = aTexCoord;
                gl_Position = vec4(aPosition, 0, 1);
            }
        `;

        const fragmentShader = `
            precision mediump float;
            varying vec2 vTexCoord;
            uniform float uTime;
            uniform vec2 uResolution;
            
            void main() {
                // Blinds effect: vertical slats compressing/expanding
                int numBlinds = 6;
                float t = mod(uTime, 2.0); // 0 to 2
                
                vec2 uv = vTexCoord;
                vec2 color;
                
                for (int i = 0; i < numBlinds; i++) {
                    float pos = float(i) / float(numBlinds);
                    float nextPos = float(i + 1) / float(numBlinds);
                    float width = nextPos - pos;
                    
                    // Calculate blind motion - compress to center then expand
                    float compressedWidth = width * (1.0 - t * 0.9);
                    float centerOffset = (pos + nextPos) / 2.0 - 0.5;
                    float blindStart = pos + centerOffset * t;
                    
                    if (uv.x >= blindStart && uv.x < blindStart + compressedWidth) {
                        // Inside this blind - show alternating colors
                        color = mod(float(i), 2.0) == 0.0 ? vec2(1.0, 0.3) : vec2(0.3, 1.0);
                    }
                }
                
                gl_FragColor = vec4(color, 0.5, 1.0);
            }
        `;

        let shader;
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            shader = createShader(vertexShader, fragmentShader);
        }

        function draw() {
            background(0);
            shader.setUniform('uTime', frameCount * 0.016);
            shader.setUniform('uResolution', [width, height]);
            shader.drawRect(0, 0, width, height);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
