<!DOCTYPE html>
<html>
<head>
    <title>Video Toaster - Trails</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script>
        const vertexShader = `
            attribute vec2 aPosition;
            attribute vec2 aTexCoord;
            varying vec2 vTexCoord;
            void main() {
                vTexCoord = aTexCoord;
                gl_Position = vec4(aPosition, 0, 1);
            }
        `;

        const fragmentShader = `
            precision mediump float;
            varying vec2 vTexCoord;
            uniform float uTime;
            uniform vec2 uResolution;
            
            void main() {
                // Trails: moving video leaves trails behind
                vec2 uv = vTexCoord;
                
                // Create a moving object
                vec2 pos = vec2(sin(uTime * 1.5), cos(uTime));
                float dist = length(uv - pos);
                
                // Object with trailing effect
                float obj = smoothstep(0.1, 0.0, dist);
                
                // Trail fades over time
                float trail = smoothstep(0.3, 0.1, dist) * (1.0 - dist * 2.0);
                trail *= 0.3; // Fade the trail
                
                vec2 color = obj * vec2(1.0, 1.0, 0.0) + trail * vec2(0.5, 0.5, 0.0);
                
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        let shader;
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            shader = createShader(vertexShader, fragmentShader);
        }

        function draw() {
            background(0);
            shader.setUniform('uTime', frameCount * 0.016);
            shader.setUniform('uResolution', [width, height]);
            shader.drawRect(0, 0, width, height);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
