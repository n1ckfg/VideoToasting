<!DOCTYPE html>
<html>
<head>
    <title>Video Toaster - Split</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script>
        const vertexShader = `
            attribute vec3 aPosition;
            attribute vec2 aTexCoord;
            varying vec2 vTexCoord;
            void main() {
                vec4 positionVec4 = vec4(aPosition, 1.0);
                positionVec4.xy = positionVec4.xy * 2.0 - 1.0;
                vTexCoord = aTexCoord;
                gl_Position = positionVec4;
            }
        `;

        const fragmentShader = `
            precision mediump float;
            varying vec2 vTexCoord;
            uniform float uTime;
            uniform vec2 uResolution;

            void main() {
                // Split: video divided in two pieces
                float splitPos = 0.5 + sin(uTime) * 0.3;
                float gap = 0.02 + sin(uTime * 3.0) * 0.01;

                vec3 color;
                if (vTexCoord.x < splitPos - gap * 0.5) {
                    color = vec3(1.0, 0.5, 0.0); // Left side (orange)
                } else if (vTexCoord.x > splitPos + gap * 0.5) {
                    color = vec3(0.0, 0.5, 1.0); // Right side (cyan)
                } else {
                    color = vec3(0.1, 0.1, 0.1); // Gap (dark)
                }

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        let shaderProgram;

        function setup() {
            createCanvas(windowWidth, windowHeight, WEBGL);
            noStroke();
            shaderProgram = createShader(vertexShader, fragmentShader);
        }

        function draw() {
            shader(shaderProgram);
            shaderProgram.setUniform('uTime', frameCount * 0.016);
            shaderProgram.setUniform('uResolution', [width, height]);
            plane(width, height);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight, WEBGL);
        }
    </script>
</body>
</html>
