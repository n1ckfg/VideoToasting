<!DOCTYPE html>
<html>
<head>
    <title>Video Toaster - Split</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script>
        const vertexShader = `
            attribute vec2 aPosition;
            attribute vec2 aTexCoord;
            varying vec2 vTexCoord;
            void main() {
                vTexCoord = aTexCoord;
                gl_Position = vec4(aPosition, 0, 1);
            }
        `;

        const fragmentShader = `
            precision mediump float;
            varying vec2 vTexCoord;
            uniform float uTime;
            uniform vec2 uResolution;
            
            void main() {
                // Split: video divided in two pieces
                float t = mod(uTime, 2.0);
                float splitPos = 0.5 + sin(uTime) * 0.3;
                float gap = 0.02 + sin(uTime * 3.0) * 0.01;
                
                vec2 color;
                if (vTexCoord.x < splitPos - gap * 0.5) {
                    color = vec2(1.0, 0.5, 0.0); // Left side (orange)
                } else if (vTexCoord.x > splitPos + gap * 0.5) {
                    color = vec2(0.0, 0.5, 1.0); // Right side (cyan)
                } else {
                    color = vec2(0.1, 0.1, 0.1); // Gap (dark)
                }
                
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        let shader;
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            shader = createShader(vertexShader, fragmentShader);
        }

        function draw() {
            background(0);
            shader.setUniform('uTime', frameCount * 0.016);
            shader.setUniform('uResolution', [width, height]);
            shader.drawRect(0, 0, width, height);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
