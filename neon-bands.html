<!DOCTYPE html>
<html>
<head>
    <title>Video Toaster - NEON BANDS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script>
        const vertexShader = `
            attribute vec2 aPosition;
            attribute vec2 aTexCoord;
            varying vec2 vTexCoord;
            void main() {
                vTexCoord = aTexCoord;
                gl_Position = vec4(aPosition, 0, 1);
            }
        `;

        const fragmentShader = `
            precision mediump float;
            varying vec2 vTexCoord;
            uniform float uTime;
            uniform vec2 uResolution;
            
            void main() {
                // NEON BANDS: Color cycling palette fade transition
                vec2 uv = vTexCoord;
                
                // Create horizontal neon bands
                int numBands = 8;
                float bandHeight = 1.0 / float(numBands);
                
                vec3 color;
                for (int i = 0; i < numBands; i++) {
                    float bandY = float(i) * bandHeight;
                    float bandCenter = bandY + bandHeight * 0.5;
                    
                    // Cycle through colors based on time
                    float cycle = sin(uTime + float(i) * 0.8);
                    float bandOpacity = smoothstep(bandHeight * 0.4, 0.0, abs(uv.y - bandCenter));
                    
                    // Neon colors cycling
                    vec3 neonColor = vec3(
                        0.5 + 0.5 * sin(uTime * 2.0 + float(i) * 0.5),
                        0.5 + 0.5 * sin(uTime * 2.0 + float(i) * 0.5 + 2.0),
                        0.5 + 0.5 * sin(uTime * 2.0 + float(i) * 0.5 + 4.0)
                    );
                    
                    color += bandOpacity * neonColor;
                }
                
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        let shader;
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            shader = createShader(vertexShader, fragmentShader);
        }

        function draw() {
            background(0);
            shader.setUniform('uTime', frameCount * 0.016);
            shader.setUniform('uResolution', [width, height]);
            shader.drawRect(0, 0, width, height);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
