<!DOCTYPE html>
<html>
<head>
    <title>Video Toaster - Tumble</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script>
        const vertexShader = `
            attribute vec2 aPosition;
            attribute vec2 aTexCoord;
            varying vec2 vTexCoord;
            void main() {
                vTexCoord = aTexCoord;
                gl_Position = vec4(aPosition, 0, 1);
            }
        `;

        const fragmentShader = `
            precision mediump float;
            varying vec2 vTexCoord;
            uniform float uTime;
            uniform vec2 uResolution;
            
            void main() {
                // Tumble: video flips around horizontal or vertical axis
                vec2 uv = vTexCoord;
                
                // Flip animation
                float t = mod(uTime, 3.14159 * 2.0);
                float angle = t;
                
                // Simulate flip by mirroring based on angle
                float flip = sin(angle);
                vec2 flippedUV = uv;
                
                // Horizontal flip effect
                if (flip > 0.0) {
                    flippedUV.x = 1.0 - uv.x;
                }
                
                // Add some perspective distortion
                flippedUV.y = uv.y + flip * (0.5 - uv.y) * 0.3;
                
                vec2 color;
                if (flip > 0.0) {
                    color = vec2(1.0, 0.3, 0.3);
                } else {
                    color = vec2(0.3, 0.3, 1.0);
                }
                
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        let shader;
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            shader = createShader(vertexShader, fragmentShader);
        }

        function draw() {
            background(0);
            shader.setUniform('uTime', frameCount * 0.016);
            shader.setUniform('uResolution', [width, height]);
            shader.drawRect(0, 0, width, height);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
